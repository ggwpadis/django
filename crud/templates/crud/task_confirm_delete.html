<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete task</title>
</head>
<body>
    <h1>Delete task</h1>
    <p>Are you sure you want to delete "{{ task.title }}"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, delete</button>
    </form>

    <a href="{% url 'crud:task_detail' task.pk %}">Cancel</a>
</body>
</html>
