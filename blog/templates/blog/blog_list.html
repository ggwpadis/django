<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список статей</title>
</head>
<body>
    <h1>Список статей</h1>

    {% for item in blogs %}
        <article>
            <h2>
                <a href="{% url 'blog_detail' item.id %}">
                    {{ item.title }}
                </a>
            </h2>
            <p>{{ item.description }}</p>
            <p>Автор: {{ item.author }}</p>
            <p>Просмотры: {{ item.likes }}</p>
        </article>
    {% empty %}
        <p>Статей пока нет.</p>
    {% endfor %}
</body>
</html>
